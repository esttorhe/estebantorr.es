# ABOUTME: Notifies sites linked from published posts by sending outbound webmentions, then commits the sent-ledger.
# ABOUTME: Deliberately NOT part of deploy.yml — sending is a courtesy that must not gate a deploy, and a slow or dead target host should never fail a release.

name: Send webmentions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and report without sending'
        type: boolean
        default: false
      limit:
        description: 'Stop after this many sends (blank = no limit)'
        type: string
        default: ''
  schedule:
    # Weekly, Mondays 05:10 UTC. New posts are rare and the ledger means only
    # genuinely new (source, target) pairs are ever attempted, so anything more
    # frequent would just re-probe the same endpoint-less hosts.
    - cron: '10 5 * * 1'

concurrency:
  group: send-webmentions
  cancel-in-progress: false

jobs:
  send:
    name: Send
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise + pinned toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sender reads dist/, i.e. exactly the HTML that ships, rather than
      # re-deriving links from the MDX source.
      - name: Build the site
        run: bun run build

      # Inputs are passed through env rather than interpolated into the script.
      # A ${{ }} expression is substituted before the shell runs, so a crafted
      # input value would be executed as shell; via env the shell only ever sees
      # it as data.
      - name: Send webmentions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SEND_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=''
          if [ "$DRY_RUN" = 'true' ]; then ARGS="$ARGS --dry"; fi
          if [ -n "$SEND_LIMIT" ]; then ARGS="$ARGS --limit $SEND_LIMIT"; fi
          bun run webmentions:send -- $ARGS

      # No deploy is dispatched: the ledger is bookkeeping and changes nothing
      # the site renders.
      - name: Commit the sent-ledger
        if: inputs.dry_run != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/webmentions-sent.json
          if git diff --staged --quiet; then
            echo 'Ledger unchanged.'
          else
            git commit -m 'chore(webmentions): record sent webmentions'

            # Same race as the sync workflow: main can move between checkout
            # and push. Losing it here would discard the record of webmentions
            # that were actually delivered, so the next run would send them
            # again. Rebase and retry.
            pushed=false
            for attempt in 1 2 3; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt ${attempt}/3) — rebasing onto origin/main"
              git pull --rebase --autostash origin main
            done

            if [ "$pushed" != 'true' ]; then
              echo '::error::could not push the sent-ledger after 3 attempts — the next run may re-send'
              exit 1
            fi
          fi
