# ABOUTME: Notifies sites linked from published posts by sending outbound webmentions, then commits the sent-ledger.
# ABOUTME: Deliberately NOT part of deploy.yml — sending is a courtesy that must not gate a deploy, and a slow or dead target host should never fail a release.

name: Send webmentions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and report without sending'
        type: boolean
        default: false
      limit:
        description: 'Stop after this many sends (blank = no limit)'
        type: string
        default: ''
  schedule:
    # Weekly, Mondays 05:10 UTC. New posts are rare and the ledger means only
    # genuinely new (source, target) pairs are ever attempted, so anything more
    # frequent would just re-probe the same endpoint-less hosts.
    - cron: '10 5 * * 1'

concurrency:
  group: send-webmentions
  cancel-in-progress: false

jobs:
  send:
    name: Send
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise + pinned toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sender reads dist/, i.e. exactly the HTML that ships, rather than
      # re-deriving links from the MDX source.
      - name: Build the site
        run: bun run build

      - name: Send webmentions
        run: |
          ARGS=''
          if [ '${{ inputs.dry_run }}' = 'true' ]; then ARGS="$ARGS --dry"; fi
          if [ -n '${{ inputs.limit }}' ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          bun run webmentions:send -- $ARGS

      # No deploy is dispatched: the ledger is bookkeeping and changes nothing
      # the site renders.
      - name: Commit the sent-ledger
        if: inputs.dry_run != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/webmentions-sent.json
          if git diff --staged --quiet; then
            echo 'Ledger unchanged.'
          else
            git commit -m 'chore(webmentions): record sent webmentions'
            git push
          fi
